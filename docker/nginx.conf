server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # nginx >= 1.21 already maps `application/wasm` to .wasm in mime.types,
    # which is required for WebAssembly.instantiateStreaming().
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        application/manifest+json
        image/svg+xml;

    # The service worker and the HTML entrypoint must never be cached, or
    # users would get stuck on a stale shell.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Scripts and stylesheets are emitted with *unhashed* names (index.js,
    # openscad-worker.js, …), so they must be revalidated on every load.
    # Long-caching them makes a browser keep running a previous build for days
    # after a redeploy — which silently defeats fixes, including changes to the
    # worker (worker script fetches are not refreshed by a normal reload). ETag
    # revalidation keeps this cheap (usually a 304).
    location ~* \.(?:js|css|wasm)$ {
        add_header Cache-Control "no-cache";
        expires 0;
        access_log off;
        try_files $uri =404;
    }

    # Immutable, large binary/asset payloads that are effectively static
    # (libraries, fonts, media).
    location ~* \.(?:woff2?|ttf|png|jpe?g|gif|svg|glb|gltf|zip|wav|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Single-page app fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
