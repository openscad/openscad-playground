  #   runs-on: ubuntu-24.04
  #   permissions:
  #     contents: write
  #   steps:
  #     - uses: actions/download-artifact@v8
  #       with: { name: openscad.fallback.js }
  #     - run: gh release upload "$GITHUB_REF_NAME" openscad.fallback.js
