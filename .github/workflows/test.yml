name: Test Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [
          "22",
          "24",
          "26",
        ]
    name: Node v${{ matrix.node }}
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - name: Setup node v${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - name: Archive production artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-node-v${{ matrix.node }}
          path: dist
          retention-days: 30
      # E2E runs on a single Node version: the browser tests exercise the built
      # app, not Node. Dev (port 4000) and prod (port 3000) don't clash, so run
      # them concurrently.
      - name: E2E tests (development and production)
        if: matrix.node == '24'
        run: |
          NODE_ENV=development npm run test:e2e & dev=$!
          NODE_ENV=production npm run test:e2e & prod=$!
          status=0
          wait $dev || status=1
          wait $prod || status=1
          exit $status
